<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antibiotika – Wunderwaffe mit Ablaufdatum?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
  /* Vorübergehend nur der Video-Player; das Drehbuch liegt in der Git-Historie (Commit 128387f) */
  :root { --bg: #eef3f0; --ink: #14201b; --accent: #c98a12; --line: #d6e0db; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1412; --ink: #e5ede9; --accent: #f0b54a; --line: #24312c; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    display: grid; place-items: center; min-height: 100vh; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: min(1100px, 100%); }
  h1 {
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; font-weight: 800;
    font-size: clamp(1.5rem, 4.5vw, 2.6rem); line-height: 1.1; letter-spacing: -.02em;
    margin: 0 0 18px; text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--accent); }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>Antibiotika – Wunderwaffe mit <em>Ablaufdatum?</em></h1>
  <video controls playsinline preload="metadata" src="video/antibiotika_video.mp4#t=2"></video>
</main>
</body>
