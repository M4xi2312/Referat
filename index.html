<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Antibiotika – Wunderwaffe mit Ablaufdatum?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Vorübergehend nur der Video-Player; das Drehbuch liegt in der Git-Historie (Commit 128387f).
     Das Video liegt nur verschlüsselt im Repo (encrypt.py) und wird nach dem Passwort im Browser entschlüsselt. */
  :root { --bg: #eef3f0; --surface: #fff; --ink: #14201b; --muted: #5a6a63; --accent: #c98a12; --line: #d6e0db; --red: #cf3a2e; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1412; --surface: #161f1c; --ink: #e5ede9; --muted: #92a29b; --accent: #f0b54a; --line: #24312c; --red: #f07a6e; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 400 17px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
    display: grid; place-items: center; min-height: 100vh; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: min(1100px, 100%); }
  h1 {
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; font-weight: 800;
    font-size: clamp(1.5rem, 4.5vw, 2.6rem); line-height: 1.1; letter-spacing: -.02em;
    margin: 0 0 18px; text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--accent); }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; border: 1px solid var(--line); }
  form {
    width: min(420px, 100%); margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 24px; display: grid; gap: 12px;
  }
  label { font-weight: 700; }
  .row { display: flex; gap: 10px; }
  input {
    flex: 1; min-width: 0; font: 700 1.3rem/1 "Atkinson Hyperlegible", system-ui, sans-serif; letter-spacing: .25em;
    padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font: 700 1rem "Atkinson Hyperlegible", system-ui, sans-serif; padding: 0 18px; border: 0; border-radius: 10px;
    background: var(--accent); color: #14201b; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .msg { min-height: 1.5em; margin: 0; color: var(--muted); font-size: .95rem; }
  .msg.err { color: var(--red); }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  [hidden] { display: none !important; }
</style>
<script src="video/zugang.js"></script>
</head>
<body>
<main>
  <h1>Antibiotika – Wunderwaffe mit <em>Ablaufdatum?</em></h1>
  <form id="gate" autocomplete="off">
    <label for="pw">Passwort</label>
    <div class="row">
      <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
      <button type="submit" id="go">Öffnen</button>
    </div>
    <div class="bar" id="bar" hidden><span></span></div>
    <p class="msg" id="msg" role="status"></p>
  </form>
  <video id="player" controls playsinline hidden></video>
</main>
<script>
(function () {
  "use strict";
  var Z = window.ZUGANG;
  var form = document.getElementById("gate"), pw = document.getElementById("pw"), go = document.getElementById("go");
  var msg = document.getElementById("msg"), bar = document.getElementById("bar"), fill = bar.firstElementChild;
  var player = document.getElementById("player");
  var bytes = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };
  function say(text, err) { msg.textContent = text; msg.classList.toggle("err", !!err); }

  async function keyFor(password) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: bytes(Z.salt), iterations: Z.iterations },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }

  async function download() {
    var res = await fetch("video/antibiotika_video.enc");
    if (!res.ok) throw new Error("HTTP " + res.status);
    var total = +res.headers.get("Content-Length") || 0, got = 0, parts = [];
    var reader = res.body.getReader();
    for (;;) {
      var r = await reader.read();
      if (r.done) break;
      parts.push(r.value); got += r.value.length;
      if (total) { fill.style.width = (got / total * 100).toFixed(1) + "%"; say("Video wird geladen … " + Math.round(got / total * 100) + " %"); }
    }
    var all = new Uint8Array(got), o = 0;
    parts.forEach(function (p) { all.set(p, o); o += p.length; });
    return all;
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { say("Dieser Browser kann das Video nicht öffnen.", true); return; }
    go.disabled = true; say("Passwort wird geprüft …");
    try {
      var key = await keyFor(pw.value);
      try {
        await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(Z.checkIv) }, key, bytes(Z.check));
      } catch (_) {
        say("Falsches Passwort.", true); go.disabled = false; pw.select(); return;
      }
      bar.hidden = false;
      var data = await download();
      say("Video wird entschlüsselt …");
      var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.subarray(0, 12) }, key, data.subarray(12));
      player.src = URL.createObjectURL(new Blob([plain], { type: "video/mp4" }));
      form.hidden = true; player.hidden = false;
    } catch (err) {
      say("Das Video konnte nicht geladen werden. Bitte später noch einmal versuchen.", true);
      go.disabled = false; bar.hidden = true;
    }
  });
})();
</script>
</body>
</html>
