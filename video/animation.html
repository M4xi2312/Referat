      farm.setAttribute("opacity", vis(t, l(1).t0, l(2).t0 + .2));
      const s1 = i => s(1, i);
      const side = P(t, s1(1).t0, .8, io), toFlow = P(t, s1(2).t0, .8, io);
      place(barnG, lerp(lerp(960, 330, side), 290, toFlow), lerp(450, lerp(470, 490, toFlow), side), lerp(1.7, 1, Math.max(side, toFlow)), P(t, l(1).t0 + .1, .5));
      barnLab.setAttribute("x", lerp(lerp(960, 330, side), 290, toFlow)); barnLab.setAttribute("y", lerp(680, lerp(600, 620, toFlow), Math.max(side, toFlow)));
      barnLab.setAttribute("opacity", P(t, l(1).t0 + .6, .5));
      place(usa, 700, 470, 1, vis(t, s1(1).t0 + .4, s1(2).t0 + .2));
      barT.setAttribute("width", 880 * P(t, s1(1).t0 + .9, 1.2, io)); barM.setAttribute("width", 230 * P(t, s1(1).t0 + 1.6, 1, io));
      lT.setAttribute("x", 20); lT.setAttribute("fill", C.surface); lM.setAttribute("x", 250);
      lT.setAttribute("opacity", P(t, s1(1).t0 + 1.8, .4)); lM.setAttribute("opacity", P(t, s1(1).t0 + 2.4, .4));
      four.setAttribute("opacity", P(t, s1(1).t0 + 3, .4));
      flow.setAttribute("opacity", P(t, s1(2).t0 + .3, .5));
      const nodeAt = [s1(2).t0 + 1.6, s1(2).t0 + 2.4, s1(2).t0 + 3.1];
      nodes.forEach((n, i) => pop(n.g, t, nodeAt[i], 960, n.y));
      pop(pers, t, s1(2).t0 + 3.8, 1620, 490);
      paths.forEach((p, i) => p.setAttribute("stroke-dasharray", `${P(t, nodeAt[i >> 1] - .4 + (i % 2) * .6, .8)} 1`));
      germsOnPath.forEach(({ g, p }, i) => {
        const st = nodeAt[i >> 1] + (i % 2) * 1.2, u = ((t - st) % 2.4) / 2.4;
        if (t < st || t > l(2).t0) { g.setAttribute("opacity", 0); return; }
        const pt = p.getPointAtLength(u * p.getTotalLength());
        place(g, pt.x, pt.y, 1, Math.sin(u * Math.PI));
      });
      place(ban, 960, 145, lerp(1.3, 1, P(t, s1(3).t0 + .6, .5, back)), P(t, s1(3).t0 + .6, .3), -2);
      // Brasilien
      br.setAttribute("opacity", vis(t, l(2).t0, 99));
      const s20 = s(2, 0), s21 = s(2, 1);
      pop(fBR, t, s20.t0 + .2, 460, 560); lBR.setAttribute("opacity", P(t, s20.t0 + .5, .4));
      pop(fEU, t, s20.t0 + .8, 1400, 380); lEU.setAttribute("opacity", P(t, s20.t0 + 1.1, .4));
      pop(fCH, t, s20.t0 + 1.4, 1640, 520); lCH.setAttribute("opacity", P(t, s20.t0 + 1.7, .4));
      arc.setAttribute("opacity", P(t, s20.t0 + 1.6, .5));
      const stopAt = s20.t0 + 5.6;
      goods.forEach((g, i) => {
        let u = 0, o = 0;
        if (t < stopAt) {
          const st = s20.t0 + 2 + i * .75;
          if (t > st) { u = ((t - st) % 3) / 3; o = Math.min(1, u * 8, (1 - u) * 8) * (1 - P(t, stopAt - .3, .3)); }
        } else {
          const st = stopAt + .6 + i * .6;
          if (t > st) {
            const ph = ((t - st) % 2.4) / 2.4;
            u = ph < .5 ? lerp(0, .44, out(ph / .5)) : lerp(.44, .34, (ph - .5) / .5);
            o = ph < .5 ? Math.min(1, ph * 10) : 1 - (ph - .5) / .5;
          }
        }
        const [x, y] = arcP(u);
        place(g, x, y, 1, o);
      });
      const [sx2, sy2] = arcP(.52);
      pop(stop, t, stopAt, sx2 + 10, sy2 + 10);
      pop(head, t, stopAt + .4, 960, 130);
      pop(why, t, s21.t0 + .5, 960, 840);
    };
  }
},
{
  title: "Outro", dur: 15, lead: .5, tail: 4.5, cam: true,
  lines: [
    ["A", "Antibiotika retten jeden Tag Leben."],
    ["B", "Damit das so bleibt, sollten wir sie nur nehmen, wenn ein Arzt sie verschreibt – und dann genau so lange, wie er es sagt."],
    ["C", "Danke fürs Zuschauen!"]
  ],
  build(root, S) {
    const cam = G(root), setWho = camPlaceholder(cam, "Szene 6 · ihr drei im Bild");
    const cr = G(root);
    E("rect", { width: 1920, height: 1080, fill: C.bg }, cr);
    const dG = G(cr), dish = petri(dG, 120, 7);
    T(cr, 960, 470, "Antibiotika – Wunderwaffe mit Ablaufdatum?", { anchor: "middle", size: 64, weight: 800, font: F.display });
    const credits = window.TIMING ? window.TIMING.credits : ["Sprecher: Name A · Name B · Name C", "Klasse: …", "Quelle: Wikipedia, Artikel „Antibiotikum“"];
    credits.forEach((c, i) => T(cr, 960, 590 + i * 66, c, { anchor: "middle", size: /^Quelle/.test(c) ? 34 : 42, fill: /^Quelle/.test(c) ? C.muted : C.ink }));
    return t => {
      setWho(S.whoAt(t));
      const ct = S.dur - S.tail + .3;
      cr.setAttribute("opacity", P(t, ct, .7, io));
      place(dG, 960, 260, 1, 1);
      dish.update(P(t, ct, 1), P(t, ct + .6, 1, back), P(t, ct + 1, 1.2));
    };
  }
}
];

/* ------------------------------------------------------------------ Zeitplan */
const GAP = .5;
const words = s => s.split(/\s+/).filter(Boolean).length;
const TM = window.TIMING ? window.TIMING.scenes : null;
let acc = 0;
SCENES.forEach((sc, k) => {
  const tm = TM && TM[k];
  if (tm) { sc.dur = tm.dur; sc.lead = tm.lead; sc.tail = tm.tail; }
  sc.start = acc; acc += sc.dur;
  const total = sc.lines.reduce((n, [, s]) => n + words(s), 0);
  const per = (sc.dur - sc.lead - sc.tail - GAP * (sc.lines.length - 1)) / total;
  let t = sc.lead;
  sc.L = sc.lines.map(([who, text]) => {
    const line = { who, text, t0: t, sents: [] };
    let u = t;
    for (const s of text.split(/(?<=[.!?])\s+/)) { const d = words(s) * per; line.sents.push({ text: s, t0: u, t1: u + d }); u += d; }
    line.t1 = u; t = u + GAP;
    return line;
  });
  if (tm) sc.L.forEach((line, i) => {
    const r = tm.lines[i];
    // Nicht aufgenommene Zeilen liegen hinter dem Szenenende, ihre Animationen erscheinen also nie
    if (!r) { line.t0 = line.t1 = 1e6; line.sents.forEach(s => { s.t0 = s.t1 = 1e6; }); return; }
    line.t0 = r.t0; line.t1 = r.t1; line.words = r.words;
    line.sents.forEach((s, j) => { [s.t0, s.t1] = r.sents[j]; });
  });
  sc.l = i => sc.L[i];
  sc.s = (i, j) => sc.L[i].sents[j];
  sc.wordAt = (i, re) => { const w = (sc.L[i].words || []).find(([x]) => re.test(x)); return w ? w[1] : null; };
  sc.whoAt = t => { for (const ln of sc.L) if (t >= ln.t0 - .2 && t < ln.t1 + GAP) return ln.who; return ""; };
  sc.sentAt = t => {
    let best = null;
    for (const ln of sc.L) for (const s of ln.sents) if (t >= s.t0) best = [ln.who, s.text, s.t1];
    return best && t < best[2] + GAP * .8 ? best : null;
  };
});
const DURATION = acc;

/* ------------------------------------------------------------------ Darstellung */
const sub = document.getElementById("sub"), subWho = sub.querySelector(".who"), subTxt = sub.querySelector(".txt");
const hudR = document.getElementById("hud-r");
const params = new URLSearchParams(location.search);
let built = false;
function build() {
  for (const sc of SCENES) { sc.root = G(svg); sc.update = sc.build(sc.root, sc); }
  for (const sc of SCENES) sc.root.style.display = "none";
  built = true;
}
function renderAt(T0) {
  const t = clamp(T0, 0, DURATION - 1e-3);
  let cur = SCENES[0];
  for (const sc of SCENES) { const on = t >= sc.start && t < sc.start + sc.dur; sc.root.style.display = on ? "" : "none"; if (on) cur = sc; }
  const lt = t - cur.start;
  cur.update(lt);
  cur.root.setAttribute("opacity", cur.cam && lt > 1 ? 1 : Math.min(P(lt, 0, .3, io), 1 - P(lt, cur.dur - .3, .3, io)));
  const s = params.get("sub") === "0" ? null : cur.sentAt(lt);
  sub.classList.toggle("off", !s);
  if (s) {
    const [col, soft] = WHO[s[0]];
    subWho.textContent = s[0]; subWho.style.background = soft; subWho.style.color = col;
    subTxt.textContent = s[1];
  }
  hudR.textContent = `Szene ${SCENES.indexOf(cur) + 1} · ${cur.title} · ${fmtTime(t)}`;
}
window.DURATION = DURATION;
window.renderAt = renderAt;
window.ready = document.fonts.ready.then(() => document.fonts.load('800 40px "Bricolage Grotesque"')).then(() => { build(); renderAt(0); return DURATION; });

/* Abspielen im Browser */
if (params.has("render")) {
  document.body.classList.add("render");
  if (params.get("hud") === "0") document.body.classList.add("nohud");
} else {
  const stage = document.getElementById("stage"), seek = document.getElementById("seek"), btn = document.getElementById("play"), tm = document.getElementById("time");
  let playing = false, t = +(params.get("t") || 0), last = 0;
  function fit() {
    const s = Math.min(innerWidth / 1920, (innerHeight - 56) / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 56 - 1080 * s) / 2}px) scale(${s})`;
  }
  addEventListener("resize", fit); fit();
  function show() { renderAt(t); seek.value = t; tm.textContent = fmtTime(t) + " / " + fmtTime(DURATION); }
  function loop(now) {
    if (!playing) return;
    t += (now - last) / 1000; last = now;
    if (t >= DURATION) { t = DURATION; playing = false; btn.textContent = "▶ Abspielen"; }
    show(); requestAnimationFrame(loop);
  }
  function toggle() {
    playing = !playing; btn.textContent = playing ? "❚❚ Pause" : "▶ Abspielen";
    if (playing) { if (t >= DURATION) t = 0; last = performance.now(); requestAnimationFrame(loop); }
  }
  btn.addEventListener("click", toggle);
  addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); toggle(); } });
  seek.addEventListener("input", () => { t = +seek.value; show(); });
  window.ready.then(() => { seek.max = DURATION; show(); });
}
</script>
